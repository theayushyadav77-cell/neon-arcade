    .skin-swatch {

    .skin-title {

    }

    .skin-status {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--neon-gold);
    }
  </style>

  <script>
    // ADSTERRA AD TRIGGER HELPER (Reloads Popunder / Social Bar on Reward / Every 3rd Retry)
    const POPUNDER_SRC = "https://afders.org/1/37809e3c984e1afaba9b638afed585fb";
    function triggerAdsterraAd() {
      try {
        const s = document.createElement('script');
        s.dataset.cfasync = "false";
        s.src = POPUNDER_SRC + "?t=" + Date.now();
        document.body.appendChild(s);
      } catch (e) {}
    }

    // SOUND SYNTHESIZER (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq = 440, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // PLAYER DATA & LOCALSTORAGE
    let coins = parseInt(localStorage.getItem('na_coins') || '50', 10);
    let streak = parseInt(localStorage.getItem('na_streak') || '1', 10);
    let bestScores = JSON.parse(localStorage.getItem('na_best') || '{"dodge":0,"lock":0,"jump":0}');
    let ownedSkins = JSON.parse(localStorage.getItem('na_skins') || '["#00f3ff"]');
    let activeSkin = localStorage.getItem('na_active_skin') || '#00f3ff';

    const SKINS = [
      { name: 'Cyber Cyan', color: '#00f3ff', price: 0 },
      { name: 'Neon Pink', color: '#ff007f', price: 100 },
      { name: 'Solar Gold', color: '#ffb703', price: 200 },
      { name: 'Matrix Green', color: '#00ff66', price: 350 },
      { name: 'Plasma Purple', color: '#b5179e', price: 500 },
      { name: 'Crimson Void', color: '#ff2a2a', price: 750 }
    ];

    // DAILY STREAK CHECK
    function checkDailyStreak() {
      const today = new Date().toDateString();
      const lastLogin = localStorage.getItem('na_last_login');
      if (lastLogin !== today) {
        if (lastLogin) {
          streak += 1;
          coins += 15 * streak;
        }
        localStorage.setItem('na_last_login', today);
        localStorage.setItem('na_streak', streak);
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('na_coins', coins);
      localStorage.setItem('na_best', JSON.stringify(bestScores));
      localStorage.setItem('na_skins', JSON.stringify(ownedSkins));
      localStorage.setItem('na_active_skin', activeSkin);
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('coins-val').textContent = coins;
      document.getElementById('streak-val').textContent = streak;
      document.getElementById('best-dodge').textContent = bestScores.dodge;
      document.getElementById('best-lock').textContent = bestScores.lock;
      document.getElementById('best-jump').textContent = bestScores.jump;
    }

    function renderShop() {
      const container = document.getElementById('skins-container');
      container.innerHTML = '';
      SKINS.forEach(s => {
        const isOwned = ownedSkins.includes(s.color);
        const isEquipped = activeSkin === s.color;
        const div = document.createElement('div');
        div.className = 'skin-item' + (isEquipped ? ' equipped' : '');
        div.innerHTML = `
          <div class="skin-swatch" style="background:${s.color}; color:${s.color}"></div>
          <div class="skin-title">${s.name}</div>
          <div class="skin-status">${isEquipped ? '✓ EQUIPPED' : (isOwned ? 'USE SKIN' : '🪙 ' + s.price)}</div>
        `;
        div.onclick = () => {
          if (isOwned) {
            activeSkin = s.color;
            playBeep(660, 0.1);
            saveData();
            renderShop();
          } else if (coins >= s.price) {
            coins -= s.price;
            ownedSkins.push(s.color);
            activeSkin = s.color;
            playBeep(880, 0.15);
            saveData();
            renderShop();
          } else {
            playBeep(180, 0.15, 'sawtooth');
            alert('Not enough coins! Play games or tap +25 Free Coins.');
          }
        };
        container.appendChild(div);
      });
    }

    function switchTab(tab) {
      document.getElementById('tab-play').classList.toggle('active', tab === 'play');
      document.getElementById('tab-shop').classList.toggle('active', tab === 'shop');
      document.getElementById('view-play').style.display = tab === 'play' ? 'flex' : 'none';
      document.getElementById('view-shop').classList.toggle('active', tab === 'shop');
      if (tab === 'shop') renderShop();
    }

    // GAME ENGINE
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let currentGame = 'dodge';
    let gameRunning = false;
    let animId = null;
    let score = 0;
    let lastEarnedCoins = 0;
    let deathCount = 0;

    function resizeCanvas() {
      const arena = document.getElementById('arena');
      canvas.width = arena.clientWidth;
      canvas.height = arena.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    const GAME_INFO = {
      dodge: {
        title: 'CYBER DODGE',
        desc: 'Tap left or right side of the box to dodge falling neon blocks!'
      },
      lock: {
        title: 'NEON LOCK',
        desc: 'Tap anywhere right when the moving laser hits the glowing gold target!'
      },
      jump: {
        title: 'GRAVITY JUMP',
        desc: 'Tap anywhere to thrust upward and fly through the neon gates!'
      }
    };

    function selectGame(gameKey) {
      currentGame = gameKey;
      gameRunning = false;
      cancelAnimationFrame(animId);
      ['dodge', 'lock', 'jump'].forEach(k => {
        document.getElementById('card-' + k).classList.toggle('selected', k === gameKey);
      });
      document.getElementById('start-title').textContent = GAME_INFO[gameKey].title;
      document.getElementById('start-desc').textContent = GAME_INFO[gameKey].desc;
      document.getElementById('start-overlay').classList.remove('hidden');
      document.getElementById('gameover-overlay').classList.add('hidden');
      resizeCanvas();
      drawIdleBg();
    }

    function drawIdleBg() {
      ctx.fillStyle = '#070810';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // STATE VARIABLES FOR GAMES
    let dodgeState = {};
    let lockState = {};
    let jumpState = {};

    function startGame() {
      resizeCanvas();
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('gameover-overlay').classList.add('hidden');
      score = 0;
      gameRunning = true;
      playBeep(520, 0.1);

      if (currentGame === 'dodge') initDodge();
      else if (currentGame === 'lock') initLock();
      else if (currentGame === 'jump') initJump();

      loop();
    }

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animId);
      playBeep(150, 0.25, 'sawtooth');
      deathCount++;

      if (score > bestScores[currentGame]) {
        bestScores[currentGame] = score;
      }
      lastEarnedCoins = Math.max(2, Math.floor(score * 1.5));
      coins += lastEarnedCoins;
      saveData();

      document.getElementById('final-score').textContent = score;
      document.getElementById('earned-coins').textContent = lastEarnedCoins;
      document.getElementById('double-btn').style.display = 'inline-block';
      document.getElementById('gameover-overlay').classList.remove('hidden');
    }

    function retryGame() {
      if (deathCount % 3 === 0) {
        triggerAdsterraAd();
      }
      startGame();
    }

    function doubleCoinsAd() {
      triggerAdsterraAd();
      coins += lastEarnedCoins;
      saveData();
      playBeep(880, 0.15);
      document.getElementById('earned-coins').textContent = lastEarnedCoins * 2 + ' (2X!)';
      document.getElementById('double-btn').style.display = 'none';
    }

    function claimFreeBonus() {
      triggerAdsterraAd();
      coins += 25;
      saveData();
      playBeep(750, 0.15);
    }

    // 1. CYBER DODGE
    function initDodge() {
      dodgeState = {
        px: canvas.width / 2,
        py: canvas.height - 45,
        pr: 15,
        dir: 0,
        speed: 5.5,
        obstacles: [],
        tick: 0
      };
    }

    function updateDodge() {
      const s = dodgeState;
      s.tick++;
      s.px += s.dir * s.speed;
      if (s.px < s.pr) s.px = s.pr;
      if (s.px > canvas.width - s.pr) s.px = canvas.width - s.pr;

      const spawnRate = Math.max(18, 42 - Math.floor(score / 3));
      if (s.tick % spawnRate === 0) {
        const w = 42 + Math.random() * 55;
        s.obstacles.push({
          x: Math.random() * (canvas.width - w),
          y: -20,
          w: w,
          h: 16,
          vy: 3.8 + Math.min(5, score * 0.12)
        });
      }

      // Draw Player
      ctx.shadowBlur = 15;
      ctx.shadowColor = activeSkin;
      ctx.fillStyle = activeSkin;
      ctx.beginPath();
      ctx.arc(s.px, s.py, s.pr, 0, Math.PI * 2);
      ctx.fill();

      // Update Obstacles
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      for (let i = s.obstacles.length - 1; i >= 0; i--) {
        const o = s.obstacles[i];
        o.y += o.vy;
        ctx.fillRect(o.x, o.y, o.w, o.h);

        // Collision check
        const cx = Math.max(o.x, Math.min(s.px, o.x + o.w));
        const cy = Math.max(o.y, Math.min(s.py, o.y + o.h));
        const dx = s.px - cx;
        const dy = s.py - cy;
        if (dx * dx + dy * dy < s.pr * s.pr) {
          ctx.shadowBlur = 0;
          endGame();
          return;
        }

        if (o.y > canvas.height) {
          s.obstacles.splice(i, 1);
          score++;
          playBeep(600, 0.04);
        }
      }
      ctx.shadowBlur = 0;
    }

    // 2. NEON LOCK
    function initLock() {
      lockState = {
        angle: 0,
        targetAngle: Math.random() * Math.PI * 2,
        dir: 1,
        speed: 0.042
      };
    }

    function updateLock() {
      const s = lockState;
      s.angle = (s.angle + s.dir * s.speed + Math.PI * 2) % (Math.PI * 2);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = Math.min(cx, cy) - 45;

      // Ring
      ctx.lineWidth = 18;
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      // Target Dot
      const tx = cx + Math.cos(s.targetAngle) * r;
      const ty = cy + Math.sin(s.targetAngle) * r;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ffb703';
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(tx, ty, 14, 0, Math.PI * 2);
      ctx.fill();

      // Player Pointer
      const px = cx + Math.cos(s.angle) * r;
      const py = cy + Math.sin(s.angle) * r;
      ctx.shadowColor = activeSkin;
      ctx.fillStyle = activeSkin;
      ctx.beginPath();
      ctx.arc(px, py, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Center score text
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(score, cx, cy);
    }

    function tapLock() {
      const s = lockState;
      let diff = Math.abs(s.angle - s.targetAngle);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      if (diff < 0.28) {
        score++;
        playBeep(720, 0.07);
        s.dir *= -1;
        s.speed = Math.min(0.11, s.speed + 0.0025);
        s.targetAngle = (s.angle + Math.PI * (0.5 + Math.random())) % (Math.PI * 2);
      } else {
        endGame();
      }
    }

    // 3. GRAVITY JUMP
    function initJump() {
      jumpState = {
        py: canvas.height / 2,
        vy: 0,
        gravity: 0.36,
        pipes: [],
        tick: 0
      };
    }

    function updateJump() {
      const s = jumpState;
      s.tick++;
      s.vy += s.gravity;
      s.py += s.vy;

      const px = 70;
      const pr = 13;

      if (s.py < pr || s.py > canvas.height - pr) {
        endGame();
        return;
      }

      if (s.tick % 75 === 0) {
        const gap = 115;
        const topH = 40 + Math.random() * (canvas.height - gap - 80);
        s.pipes.push({ x: canvas.width, topH, gap, passed: false });
      }

      // Draw Player
      ctx.shadowBlur = 14;
      ctx.shadowColor = activeSkin;
      ctx.fillStyle = activeSkin;
      ctx.beginPath();
      ctx.arc(px, s.py, pr, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      ctx.shadowColor = '#00f3ff';
      ctx.fillStyle = '#00f3ff';
      for (let i = s.pipes.length - 1; i >= 0; i--) {
        const p = s.pipes[i];
        p.x -= 3.2;
        ctx.fillRect(p.x, 0, 26, p.topH);
        ctx.fillRect(p.x, p.topH + p.gap, 26, canvas.height - (p.topH + p.gap));

        if (px + pr > p.x && px - pr < p.x + 26) {
          if (s.py - pr < p.topH || s.py + pr > p.topH + p.gap) {
            ctx.shadowBlur = 0;
            endGame();
            return;
          }
        }

        if (!p.passed && p.x + 26 < px) {
          p.passed = true;
          score++;
          playBeep(640, 0.06);
        }

        if (p.x < -30) s.pipes.splice(i, 1);
      }
      ctx.shadowBlur = 0;
    }

    // MAIN LOOP
    function loop() {
      if (!gameRunning) return;
      ctx.fillStyle = '#070810';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Score HUD in corner
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '800 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 14, 26);

      if (currentGame === 'dodge') updateDodge();
      else if (currentGame === 'lock') updateLock();
      else if (currentGame === 'jump') updateJump();

      if (gameRunning) animId = requestAnimationFrame(loop);
    }

    // INPUT HANDLERS
    function handlePointerDown(clientX) {
      if (!gameRunning) return;
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      if (currentGame === 'dodge') {
        dodgeState.dir = x < canvas.width / 2 ? -1 : 1;
      } else if (currentGame === 'lock') {
        tapLock();
      } else if (currentGame === 'jump') {
        jumpState.vy = -6.8;
        playBeep(420, 0.05);
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointerDown(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      if (currentGame === 'dodge') dodgeState.dir = 0;
    });

    canvas.addEventListener('mousedown', (e) => {
      handlePointerDown(e.clientX);
    });

    canvas.addEventListener('mouseup', () => {
      if (currentGame === 'dodge') dodgeState.dir = 0;
    });

    // INIT ON LOAD
    checkDailyStreak();
    updateHUD();
    setTimeout(() => {
      resizeCanvas();
      drawIdleBg();
    }, 100);
  </script>
